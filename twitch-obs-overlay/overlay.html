<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch OBS Overlay</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="overlay">
  <main class="overlay-shell">
    <section class="stats" aria-label="Twitch stream stats">
      <span class="stat">
        <span class="stat-label">Viewers</span>
        <span class="stat-value" id="viewerCount">--</span>
      </span>
      <span class="stat">
        <span class="stat-label">Chat</span>
        <span class="stat-value" id="chatterCount">--</span>
      </span>
    </section>
    <section id="chat" aria-live="polite"></section>
  </main>

  <script src="/overlay.js"></script>
</body>
</html>
